name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: ${{ matrix.python }}
      # The renderer and its tests use the standard library only: nothing is installed.
      - run: python test_render.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.13"
      # Uses the runner's preinstalled Chrome/Chromium; fails if no browser is available.
      - name: Check rendered fixtures and CLI in headless Chrome
        env:
          EXPLAIN_CODEBASE_REQUIRE_CHROME: "1"
        run: |
          python - <<'EOF'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          import render, test_render

          with tempfile.TemporaryDirectory() as tmp:
              d = Path(tmp)
              for fn in ("dense-1.json", "dense-2.json", "dense-3.json", "dense-4.json"):
                  p = Path("fixtures") / fn
                  m = json.loads(p.read_text(encoding="utf-8"))
                  parts, groups, flows = test_render._prep_fixture(p)
                  m["parts"], m["flows"] = parts, flows
                  ctx = {"groups": groups, "commit": None, "when": "2026-01-01", "dirty": set(), "base": None}
                  page, _ = render.build(m, d, ctx)
                  html_path = d / f"{p.stem}.html"
                  html_path.write_text(page, encoding="utf-8")
                  # browser_check runs twice: page as written, and with wide fallback font CSS (Verdana / DejaVu Sans).
                  bs = render.browser_check(html_path)
                  assert bs == [], f"{fn}: browser_check failed: {bs}"
                  print(f"{fn}: browser check ok (default + wide font)")
              # Also run render.py end-to-end on a valid temporary repo with EXPLAIN_CODEBASE_REQUIRE_CHROME=1.
              repo = d / "repo"
              (repo / "src").mkdir(parents=True)
              (repo / "docs").mkdir()
              (repo / "src/api.py").write_text("".join(f"line {i}\n" for i in range(1, 13)), encoding="utf-8")
              (repo / "src/schema.sql").write_text("create table orders (id);\n", encoding="utf-8")
              map_path = repo / "docs/how-it-works.json"
              map_path.write_text(json.dumps(test_render.GOOD), encoding="utf-8")
              r = subprocess.run([sys.executable, "render.py", str(map_path)], capture_output=True, text=True)
              print(r.stdout, r.stderr, sep="\n")
              assert r.returncode == 0, f"render.py failed with rc={r.returncode}"
              assert "browser check: all labels clear" in r.stdout
          EOF
